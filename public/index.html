<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quizzy">
    <meta name="theme-color" content="#0a0a0a">
    <title>Quizzy</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="offlineBanner" class="status-banner offline" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <div class="status-banner-text">
            <div class="status-banner-title">Offline</div>
            <div class="status-banner-sub">Storico consultabile · Nuove analisi sospese</div>
        </div>
    </div>

    <div id="updateBanner" class="status-banner update" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L3 8"/></svg>
        <div class="status-banner-text">
            <div class="status-banner-title">Nuova versione disponibile</div>
            <div class="status-banner-sub">Tocca per ricaricare</div>
        </div>
        <button id="updateReloadBtn" class="status-banner-action">Ricarica</button>
    </div>

    <div class="container">
        <main class="main-content">
            <section class="section">
                <div id="imgUploadArea" class="upload-area" tabindex="0" role="button" aria-label="Carica immagini del quiz">
                    <input type="file" id="imgInput" accept="image/*" multiple aria-hidden="true">
                    <div class="upload-label" id="imgLabel">Seleziona immagini</div>
                    <div class="upload-sublabel" id="imgSublabel">Puoi selezionare più file contemporaneamente</div>
                    <div class="status-text" id="imgStatus"></div>
                </div>
            </section>
        </main>

        <label class="precision-toggle" id="precisionToggle">
            <span>Modalità precisione</span>
            <span class="switch">
                <input type="checkbox" id="precisionInput">
                <span class="slider"></span>
            </span>
        </label>

        <div class="actions">
            <button id="historyBtn" class="btn btn-secondary" style="display:none">Storico</button>
            <button id="statusBtn" class="btn btn-secondary">Stato</button>
            <button id="clearBtn" class="btn btn-secondary">Cancella</button>
        </div>

        <div id="spentCounter" class="spent-counter" onclick="configureBudget()" role="button" aria-label="Credito disponibile, tocca per impostare"></div>

        <div id="loading" class="loading">
            <div id="imageProgress" class="image-progress"></div>
        </div>

        <div id="results" class="results">
            <div id="resultsContent"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
